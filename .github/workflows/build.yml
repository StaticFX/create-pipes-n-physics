name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` also runs the pure-Java NetworkSolver JUnit tests (no Minecraft).
      - name: Build
        run: ./gradlew build

  gametest:
    name: GameTests (Create blocks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the NeoForge gameTestServer against real Create blocks. The cross-mod
      # conduit test self-skips when createpropulsion is absent (those loose jars
      # in run/mods are not committed), so this passes with only the Gradle deps.
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Upload GameTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            build/gametest/
          if-no-files-found: ignore
          retention-days: 7
